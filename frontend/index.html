<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Host</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--blue:#2563eb;--line:#e5e7eb;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header b{color:var(--blue);font-size:18px}main{max-width:560px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}h2{margin:0 0 12px;font-size:20px}label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--text)}textarea{min-height:90px;font-family:monospace}button{padding:12px 16px;border:0;border-radius:10px;font-size:15px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:var(--red)}button:disabled{opacity:.6}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}.muted{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}#toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:auto;padding:14px;border-radius:12px;background:#111827;color:#fff;display:none;text-align:center}pre{height:60vh;overflow:auto;background:#0b1220;color:#d1fae5;padding:12px;border-radius:10px;white-space:pre-wrap}
</style>
</head>
<body>
<header><b>Bot Host</b><span id="who"></span></header><main id="app"></main><div id="toast"></div>
<script>
const API='https://api.yourdomain.com';
const GOOGLE_CLIENT_ID='xxxxx.apps.googleusercontent.com';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]);let token=localStorage.getItem('token'),me=null,tab='bots',plans=[],packages=[],bots=[],logTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)}
async function api(path,opts={}){const r=await fetch(API+path,{method:opts.method||'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:opts.body?JSON.stringify(opts.body):undefined});const data=await r.json().catch(()=>({}));if(r.status===401&&token){logout();throw new Error('Please log in again')}if(!r.ok)throw new Error(data.error||'Request failed');return data}
function logout(){localStorage.removeItem('token');token=null;me=null;showLogin()}
function showLogin(){ $('#who').textContent='';$('#app').innerHTML='<div class="card" style="text-align:center;padding-top:60px"><h2>Deploy your WhatsApp bot</h2><p class="muted">Sign in to get started.</p><div id="gbtn"></div></div>';const init=()=>{if(!window.google)return setTimeout(init,200);google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:async resp=>{try{const d=await api('/auth/google',{method:'POST',body:{credential:resp.credential}});token=d.token;localStorage.setItem('token',token);start()}catch(e){toast(e.message)}}});google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large'})};init()}
async function refreshMe(){me=await api('/api/me');$('#who').innerHTML=esc(me.name.split(' ')[0])+' · <b>'+me.coins+' coins</b> <button class="ghost" style="padding:6px 10px" onclick="logout()">Exit</button>'}
async function refreshBots(){bots=await api('/api/bots')}
function timeLeft(s){if(s<=0)return'expired';const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return d?d+'d '+h+'h left':h?h+'h '+m+'m left':m+'m left'}
function render(){const tabs=['bots','deploy','coins'].map((t,i)=>'<button class="'+(tab===t?'':'ghost')+'" onclick="setTab(\''+t+'\')">'+['My Bots','Deploy','Buy Coins'][i]+'</button>').join('');let body='';if(tab==='bots'){body=bots.length?bots.map(b=>'<div class="card"><div class="top"><b>'+esc(b.name)+'</b><span class="pill">'+esc(b.status)+'</span></div><div class="muted">+'+esc(b.owner_number)+' · '+timeLeft(b.seconds_left)+'</div><div class="row">'+(b.status==='running'?'<button class="ghost" onclick="act(\''+b.id+'\',\'stop\')">Stop</button><button class="ghost" onclick="act(\''+b.id+'\',\'restart\')">Restart</button>':'<button onclick="act(\''+b.id+'\',\'start\')">Start</button>')+'<button class="ghost" onclick="openConsole(\''+b.id+'\')">Console</button><button class="ghost" onclick="act(\''+b.id+'\',\'extend\')">'+(b.coin_cost?'Extend':'Renew')+'</button><button class="danger" onclick="del(\''+b.id+'\')">Delete</button></div></div>').join(''):'<div class="card muted">No bots yet.</div>'}if(tab==='deploy'){body='<div class="card"><h2>Bot Details</h2><label>Session ID</label><textarea id="sid"></textarea><label>Bot Name</label><input id="bname" maxlength="40"><label>Owner number</label><input id="onum" inputmode="numeric"><label>Plan</label><select id="plan">'+plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+(p.coin_cost?p.coin_cost+' coins':'FREE')+'</option>').join('')+'</select><div class="row"><button id="dbtn" onclick="deploy()">Deploy now</button></div></div>'}if(tab==='coins'){body='<div class="card"><h2>Coupon</h2><input id="cc" placeholder="Enter code"><div class="row"><button onclick="claim()">Claim coins</button></div></div>'+packages.map(p=>'<div class="card top"><div><b>'+esc(p.name)+'</b><div class="muted">'+p.coins+' coins</div></div><button onclick="buy('+p.id+')">GH₵'+(p.price/100).toFixed(2)+'</button></div>').join('')}$('#app').innerHTML='<div class="tabs">'+tabs+'</div>'+body}
async function setTab(t){clearInterval(logTimer);tab=t;try{if(t==='bots')await refreshBots()}catch(e){toast(e.message)}render()}
async function deploy(){const sessionId=$('#sid').value.trim(),name=$('#bname').value.trim(),ownerNumber=$('#onum').value.trim();if(!sessionId||!name||!/^[0-9]{7,15}$/.test(ownerNumber))return toast('Fill every field correctly');const btn=$('#dbtn');btn.disabled=true;try{await api('/api/deploy',{method:'POST',body:{sessionId,name,ownerNumber,planId:Number($('#plan').value)}});await refreshMe();await setTab('bots');toast('Bot deployed')}catch(e){toast(e.message);btn.disabled=false}}
async function act(id,what){try{await api('/api/bots/'+id+'/'+what,{method:'POST'});await refreshMe();await setTab('bots')}catch(e){toast(e.message)}}
async function del(id){if(!confirm('Delete this bot?'))return;try{await api('/api/bots/'+id,{method:'DELETE'});await setTab('bots')}catch(e){toast(e.message)}}
async function buy(packageId){try{const d=await api('/api/payments/init',{method:'POST',body:{packageId}});location.href=d.checkoutUrl}catch(e){toast(e.message)}}
async function claim(){try{const r=await api('/api/coupons/claim',{method:'POST',body:{code:$('#cc').value.trim()}});toast('You got '+r.added+' coins');await refreshMe()}catch(e){toast(e.message)}}
function openConsole(id){clearInterval(logTimer);tab='console';$('#app').innerHTML='<div class="tabs"><button class="ghost" onclick="setTab(\'bots\')">← Back</button></div><div class="card"><b>Console</b><pre id="log">Loading...</pre></div>';const load=async()=>{try{const d=await api('/api/bots/'+id+'/logs');$('#log').textContent=d.logs||'No output'}catch(e){toast(e.message);clearInterval(logTimer)}};load();logTimer=setInterval(load,3000)}
async function start(){try{await refreshMe();[plans,packages]=await Promise.all([api('/api/plans'),api('/api/packages')]);await refreshBots();render()}catch(e){toast(e.message)}}
token?start():showLogin();
</script>
</body>
</html>
